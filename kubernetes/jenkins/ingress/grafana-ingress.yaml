apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: jenkins-metrics
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: jenkins-metrics-collector
  annotations:
    # Descomentar y ajustar según tu Ingress Controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: jenkins-metrics.example.com  # Cambiar por tu dominio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
  # Descomentar para habilitar TLS
  # tls:
  #   - hosts:
  #       - jenkins-metrics.example.com
  #     secretName: grafana-tls



