version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jenkins-metrics-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=jenkins_metrics
      - POSTGRES_PASSWORD=jenkins_metrics_password
      - POSTGRES_DB=jenkins_metrics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jenkins_metrics -d jenkins_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jenkins-metrics

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jenkins-metrics

  metrics-exporter:
    build:
      context: ./metrics-exporter
      dockerfile: Dockerfile
    container_name: jenkins-metrics-exporter
    restart: unless-stopped
    environment:
      # Configurar con tu Jenkins existente
      - JENKINS_URL=${JENKINS_URL:-http://host.docker.internal:8080}
      - JENKINS_USER=${JENKINS_USER:-admin}
      - JENKINS_TOKEN=${JENKINS_TOKEN:-}
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=jenkins_metrics
      - POSTGRES_USER=jenkins_metrics
      - POSTGRES_PASSWORD=jenkins_metrics_password
      # Intervalo de polling en segundos
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jenkins-metrics

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local

networks:
  jenkins-metrics:
    driver: bridge

