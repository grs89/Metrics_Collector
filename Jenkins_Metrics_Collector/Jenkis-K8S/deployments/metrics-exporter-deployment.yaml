apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
  namespace: jenkins-metrics
  labels:
    app.kubernetes.io/name: metrics-exporter
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: jenkins-metrics-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-exporter
      app.kubernetes.io/component: exporter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-exporter
        app.kubernetes.io/component: exporter
        app.kubernetes.io/part-of: jenkins-metrics-collector
    spec:
      containers:
        - name: metrics-exporter
          image: jenkins-metrics-exporter:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: exporter-config
            - secretRef:
                name: jenkins-secret
            - secretRef:
                name: postgres-secret
          env:
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PORT
              value: "5432"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Esperando a que PostgreSQL esté listo..."
              until nc -z postgres-service 5432; do
                echo "PostgreSQL no disponible, esperando..."
                sleep 5
              done
              echo "PostgreSQL está listo!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"



